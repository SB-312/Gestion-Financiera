<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f7a5a">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mi control financiero</title>
<style>
:root{--bg:#f6f5f1;--cd:#fff;--tx:#1d2521;--mu:#68716c;--ac:#1f7a5a;--bd:#e2e0d8;--wa:#c2410c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#15191a;--cd:#1e2426;--tx:#eceee9;--mu:#96a09a;--ac:#4cc49a;--bd:#2f3739;--wa:#fb923c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:15px;margin:0 0 10px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:9px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:9px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0}
.mu{color:var(--mu)}.big{font-size:24px;font-weight:650}.wa{color:var(--wa)}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
input,select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{width:100%;margin-top:10px;padding:10px;border:0;border-radius:9px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn.alt{background:var(--mu)}
.bar{height:9px;background:var(--bd);border-radius:9px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ac)}
.pay{border:1px solid var(--ac);color:var(--ac);background:none;border-radius:7px;padding:3px 9px;font:inherit;cursor:pointer}
.x{background:none;border:0;color:var(--mu);cursor:pointer;font-size:16px}
#msg{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:616px;margin:0 auto;background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:10px;z-index:9}
[hidden]{display:none!important}
</style></head><body><main>
<h1>Mi control financiero</h1>

<section id="auth" hidden>
 <div class="card"><h2>Inicia sesión</h2>
  <label>Correo</label><input id="em" type="email" autocomplete="email">
  <label>Contraseña (mínimo 6 caracteres)</label><input id="pw" type="password" autocomplete="current-password">
  <button class="btn" id="in">Entrar</button>
  <button class="btn alt" id="up">Crear cuenta</button></div>
</section>

<div id="app" hidden>
 <div class="tabs"><button data-t="r" class="on">Resumen</button><button data-t="g">Gastos</button><button data-t="x">Fijos</button><button data-t="m">Meta Japón</button></div>
 <section id="r"></section>
 <section id="g" hidden>
  <div class="card"><h2>Registrar gasto</h2>
   <div class="g2"><div><label>Monto (COP)</label><input id="ga" type="number" inputmode="numeric" placeholder="20000"></div>
   <div><label>Categoría</label><select id="gc"><option>Comida</option><option>Ocio</option><option>Bicicleta</option><option>Otros</option></select></div></div>
   <label>Pagado con</label><select id="gm"><option value="d">Efectivo / débito</option><option value="t">Tarjeta de crédito</option></select>
   <button class="btn" id="add">Agregar</button>
   <p class="mu">Débito o efectivo se descuenta de tu saldo. Tarjeta se suma a tu deuda.</p></div>
  <div class="card"><h2>Gastos de este mes</h2><div id="list"></div></div>
 </section>
 <section id="x" hidden></section>
 <section id="m" hidden></section>
</div>
<div id="msg" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb=supabase.createClient('https://nvyyhukqgitiqmwituhk.supabase.co','sb_publishable_d_vasnMZlYLUcUzLtuU2Jw_TPek-CE8');
const $=id=>document.getElementById(id), f=n=>'$'+Math.round(n).toLocaleString('es-CO');
const CATS=['Comida','Ocio','Bicicleta','Otros'];
const S={uid:null,budgets:{Comida:50,Ocio:25,Bicicleta:5,Otros:20},income:930000,rate:35,balance:0,card:0,fixed:[{n:"Internet",v:135000,d:1,p:null},{n:"Teléfono",v:35000,d:1,p:null}],ex:[],goal:{target:12000000,saved:0}};
let mt;const msg=t=>{$('msg').textContent=t;$('msg').hidden=!t;clearTimeout(mt);if(t)mt=setTimeout(()=>msg(''),5000)};
const today=()=>new Date().toLocaleDateString('sv-SE');
const ex=()=>S.ex.filter(e=>e.d.startsWith(today().slice(0,7)));
const mk=()=>today().slice(0,7);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fixed=()=>S.fixed.reduce((a,b)=>a+b.v,0);
const pend=()=>S.fixed.map((x,i)=>({...x,i})).filter(x=>x.p!==mk()).sort((a,b)=>a.d-b.d);
const monthSave=()=>2*S.income*S.rate/100;

async function load(){
 let {data:s,error}=await sb.from('settings').select('*').maybeSingle();
 if(error)return msg(error.message);
 if(!s){const r=await sb.from('settings').insert({user_id:S.uid}).select().single();if(r.error)return msg(r.error.message);s=r.data}
 Object.assign(S,{budgets:Object.assign({Comida:50,Ocio:25,Bicicleta:5,Otros:20},s.budgets||{}),income:+s.income,rate:+s.rate,balance:+s.balance,card:+s.card,fixed:(s.fixed||[]).map(x=>Array.isArray(x)?{n:x[0],v:+x[1],d:1,p:null}:x),goal:{target:+s.goal_target,saved:+s.goal_saved}});
 const e=await sb.from('expenses').select('*').order('spent_on').order('id');
 if(e.error)return msg(e.error.message);
 S.ex=e.data.map(x=>({i:x.id,d:x.spent_on,a:+x.amount,c:x.category,t:x.on_card}));
 render();
}
async function push(){
 const {error}=await sb.from('settings').upsert({user_id:S.uid,income:S.income,rate:S.rate,balance:S.balance,card:S.card,fixed:S.fixed,goal_target:S.goal.target,goal_saved:S.goal.saved,budgets:S.budgets,updated_at:new Date().toISOString()});
 if(error)msg(error.message);
}
function inp(l,k,o){return `<label>${l}</label><input type="number" inputmode="numeric" value="${(o?S.goal:S)[k]}" data-k="${k}" data-o="${o?1:0}">`}

function renderR(){
 const e=ex(),cash=e.filter(x=>!x.t).reduce((a,b)=>a+b.a,0),cr=e.filter(x=>x.t).reduce((a,b)=>a+b.a,0);
 const budget=2*S.income-monthSave()-fixed(),spent=cash+cr,left=budget-spent,pct=Math.min(100,Math.max(0,spent/budget*100));
 const cat={};e.forEach(x=>cat[x.c]=(cat[x.c]||0)+x.a);
 const P=pend(),pv=P.reduce((a,b)=>a+b.v,0),dd=+today().slice(8);
 const fx=P.length?P.map(x=>`<div class="row"><span>${esc(x.n)} <span class="${x.d<dd?'wa':'mu'}">· día ${x.d}${x.d<dd?' (vencido)':''}</span></span><span><b>${f(x.v)}</b> <button class="pay" data-pay="${x.i}">Pagado</button></span></div>`).join(''):'<div class="row mu"><span>✓ Fijos de este mes pagados</span></div>';
 const bm=Math.max(0,budget),tot=CATS.reduce((a,c)=>a+(S.budgets[c]||0),0);
 const bud=`<div class="card"><h2>Presupuesto por categoría</h2><div class="mu">Base del mes (después de ahorro y fijos): <b>${f(bm)}</b></div>`+CATS.map(c=>{
  const pc=S.budgets[c]||0,asg=bm*pc/100,sp=cat[c]||0,rem=asg-sp,w=asg>0?Math.min(100,sp/asg*100):(sp>0?100:0);
  return `<div style="padding:8px 0;border-top:1px solid var(--bd);margin-top:8px"><div class="row"><b>${c}</b><span><input type="number" inputmode="numeric" min="0" max="100" value="${pc}" data-bd="${c}" style="width:68px;display:inline-block;padding:4px 6px"> %</span></div>
  <div class="bar"><i style="width:${w}%;${rem<0?'background:var(--wa)':''}"></i></div>
  <div class="row mu"><span>Asignado ${f(asg)} · gastado ${f(sp)}</span><b class="${rem<0?'wa':''}">${rem<0?'Te pasaste '+f(-rem):'Quedan '+f(rem)}</b></div></div>`}).join('')+
  `<div class="row ${tot>100?'wa':'mu'}"><span>${tot>100?'Te pasaste del 100%':'Sin asignar'}</span><b>${tot>100?tot+'%':(100-tot)+'%'}</b></div></div>`;
 $('r').innerHTML=`
 <div class="card"><div class="mu">Te queda para gastar este mes</div><div class="big ${left<0?'wa':''}">${f(left)}</div>
  <div class="bar"><i style="width:${pct}%"></i></div><div class="mu">Gastado ${f(spent)} de ${f(budget)} (después de ahorro y fijos)</div></div>
 <div class="card"><h2>Por pagar</h2>
  <div class="row"><span>Tarjetas de crédito</span><span><b>${f(S.card)}</b> <button class="pay" id="paycard">Pagué</button></span></div>
  ${fx}
  <div class="row"><span>Saldo en cuenta</span><b>${f(S.balance)}</b></div>
  <div class="row mu"><span>Libre tras pagar todo</span><b>${f(S.balance-S.card-pv)}</b></div></div>
 <div class="card"><h2>Cada quincena</h2>
  <div class="row"><span>Ahorro (${S.rate}%)</span><b>${f(S.income*S.rate/100)}</b></div>
  <div class="row"><span>Para vivir</span><b>${f(S.income*(1-S.rate/100))}</b></div></div>
 ${bud}
 <div class="card"><h2>Mis datos</h2>${inp('Ingreso neto por quincena','income')}${inp('% de ahorro por quincena','rate')}${inp('Saldo en cuenta','balance')}${inp('Deuda actual de tarjetas','card')}
  <button class="btn alt" id="out">Cerrar sesión</button></div>`;
 $('out').onclick=()=>sb.auth.signOut();
}
function renderG(){
 const e=ex().slice().reverse();
 $('list').innerHTML=e.length?e.map(x=>`<div class="row"><span>${x.d.slice(5)} · ${x.c}${x.t?' 💳':''}</span><span><b>${f(x.a)}</b> <button class="x" data-del="${x.i}">✕</button></span></div>`).join(''):'<span class="mu">Sin gastos registrados.</span>';
}
function renderM(){
 const g=S.goal,rem=Math.max(0,g.target-g.saved),ms=monthSave(),mo=ms>0?Math.ceil(rem/ms):0;
 const d=new Date();d.setMonth(d.getMonth()+mo);
 $('m').innerHTML=`<div class="card"><h2>🗾 Viaje a Japón</h2>
  <div class="big">${f(g.saved)} <span class="mu" style="font-size:15px">de ${f(g.target)}</span></div>
  <div class="bar"><i style="width:${Math.min(100,g.target?g.saved/g.target*100:0)}%"></i></div>
  <div class="mu">Ahorrando ${f(ms)} al mes llegas en <b>${mo} meses</b> (${d.toLocaleDateString('es-CO',{month:'long',year:'numeric'})}).</div>
  ${inp('Meta total (vuelos, hospedaje, comida, transporte)','target',1)}${inp('Ya ahorrado para Japón','saved',1)}
  <p class="mu">La meta de $12.000.000 es un valor de ejemplo: cámbiala cuando cotices vuelos y hospedaje.</p></div>`;
}
function renderX(){
 const m=mk();
 $('x').innerHTML=`<div class="card"><h2>Gastos fijos de este mes</h2>${S.fixed.length?S.fixed.map((x,i)=>{const ok=x.p===m;return `<div style="padding:8px 0;border-top:1px solid var(--bd)"><div class="row"><b>${esc(x.n)}</b><span class="${ok?'':'wa'}">${ok?'✓ Pagado':'Pendiente'}</span></div><div class="g2"><div><label>Monto</label><input type="number" inputmode="numeric" value="${x.v}" data-fi="${i}" data-fk="v"></div><div><label>Día de pago (1-31)</label><input type="number" inputmode="numeric" min="1" max="31" value="${x.d}" data-fi="${i}" data-fk="d"></div></div><div class="g2"><button class="btn" data-${ok?'undo':'pay'}="${i}">${ok?'Deshacer':'Marcar pagado'}</button><button class="btn alt" data-delx="${i}">Eliminar</button></div></div>`}).join(''):'<span class="mu">No tienes gastos fijos.</span>'}</div>
 <div class="card"><h2>Agregar gasto fijo</h2><label>Nombre</label><input id="fn"><div class="g2"><div><label>Monto</label><input id="fv" type="number" inputmode="numeric"></div><div><label>Día de pago</label><input id="fd" type="number" inputmode="numeric" min="1" max="31"></div></div><button class="btn" id="addf">Agregar</button><p class="mu">Al cambiar de mes, los fijos pagados vuelven a aparecer como pendientes. Al marcar un fijo como pagado se descuenta de tu saldo en cuenta, y al deshacerlo se devuelve.</p></div>`;
}
function render(){renderR();renderG();renderX();renderM()}

document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.bd){S.budgets[t.dataset.bd]=Math.min(100,Math.max(0,+t.value||0));render();push();return}
 if(t.dataset.fi){const x=S.fixed[+t.dataset.fi];x[t.dataset.fk]=Math.max(0,+t.value||0);if(x.d<1)x.d=1;if(x.d>31)x.d=31;render();push();return}
 if(t.dataset.k){(t.dataset.o==='1'?S.goal:S)[t.dataset.k]=+t.value||0;render();push()}});
document.addEventListener('click',async e=>{const t=e.target;
 if(t.dataset.t){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b===t));['r','g','x','m'].forEach(s=>$(s).hidden=s!==t.dataset.t)}
 if(t.dataset.del){const {error}=await sb.from('expenses').delete().eq('id',t.dataset.del);if(error)return msg(error.message);const g=S.ex.find(x=>x.i==t.dataset.del);S.ex=S.ex.filter(x=>x.i!=t.dataset.del);if(g){if(g.t)S.card-=g.a;else S.balance+=g.a;push()}render()}
 const q=t.dataset;
 if(q.pay!==undefined){const x=S.fixed[+q.pay];x.p=mk();S.balance-=x.v;render();push()}
 if(q.undo!==undefined){const x=S.fixed[+q.undo];x.p=null;S.balance+=x.v;render();push()}
 if(q.delx!==undefined&&confirm('¿Eliminar este gasto fijo?')){S.fixed.splice(+q.delx,1);render();push()}
 if(t.id==='paycard'){const r=prompt('¿Cuánto pagaste de la tarjeta?',Math.round(S.card));if(r===null)return;const a=+String(r).replace(/\D/g,'');if(!(a>0))return msg('Monto inválido');if(a>S.card)return msg('El pago es mayor que tu deuda actual');S.card-=a;S.balance-=a;render();push()}
 if(t.id==='addf'){const n=$('fn').value.trim(),v=+$('fv').value,d=Math.min(31,Math.max(1,+$('fd').value||1));if(!n||!(v>0))return msg('Escribe nombre y monto');S.fixed.push({n,v,d,p:null});render();push()}
});
$('add').onclick=async()=>{const a=+$('ga').value;if(!(a>0))return;
 const {data,error}=await sb.from('expenses').insert({amount:a,category:$('gc').value,on_card:$('gm').value==='t',spent_on:today()}).select().single();
 if(error)return msg(error.message);
 S.ex.push({i:data.id,d:data.spent_on,a:+data.amount,c:data.category,t:data.on_card});if(data.on_card)S.card+=+data.amount;else S.balance-=+data.amount;$('ga').value='';render();push()};

const creds=()=>({email:$('em').value.trim(),password:$('pw').value});
const chk=c=>!c.email||!c.password?'Escribe tu correo y contraseña':c.password.length<6?'La contraseña debe tener mínimo 6 caracteres':'';
$('in').onclick=async()=>{const c=creds(),v=chk(c);if(v)return msg(v);const {error}=await sb.auth.signInWithPassword(c);if(error)msg(error.message)};
$('up').onclick=async()=>{const c=creds(),v=chk(c);if(v)return msg(v);const {error}=await sb.auth.signUp({...c,options:{emailRedirectTo:location.origin+location.pathname}});
 msg(error?error.message:'Cuenta creada. Confirma tu correo y luego inicia sesión.')};

sb.auth.onAuthStateChange((ev,ses)=>setTimeout(async()=>{
 $('auth').hidden=!!ses;$('app').hidden=!ses;
 if(!ses){S.uid=null;return}
 if(S.uid!==ses.user.id){S.uid=ses.user.id;await load()}
},0));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.uid)load()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></main></body></html>
