<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f7a5a">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mi control financiero</title>
<style>
:root{--bg:#f6f5f1;--cd:#fff;--tx:#1d2521;--mu:#68716c;--ac:#1f7a5a;--bd:#e2e0d8;--wa:#c2410c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#15191a;--cd:#1e2426;--tx:#eceee9;--mu:#96a09a;--ac:#4cc49a;--bd:#2f3739;--wa:#fb923c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:15px;margin:0 0 10px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:9px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:9px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0}
.mu{color:var(--mu)}.big{font-size:24px;font-weight:650}.wa{color:var(--wa)}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
input,select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{width:100%;margin-top:10px;padding:10px;border:0;border-radius:9px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn.alt{background:var(--mu)}
.bar{height:9px;background:var(--bd);border-radius:9px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ac)}
.tabs button{padding:9px 2px;font-size:13px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kp div{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:10px}
.kp b{display:block;font-size:16px}
.lb{fill:var(--mu);font-size:8px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.pay{border:1px solid var(--ac);color:var(--ac);background:none;border-radius:7px;padding:3px 9px;font:inherit;cursor:pointer}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px;margin:8px 0;border-radius:10px}
.car .sl{flex:0 0 100%;scroll-snap-align:center;position:relative;aspect-ratio:16/10;border-radius:10px;overflow:hidden;background:var(--bg)}
.car .sl img{width:100%;height:100%;object-fit:cover;display:block}
.car .sl button{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:7px;width:26px;height:26px;cursor:pointer}
.car .add{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:16/10;border:2px dashed var(--bd);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--mu);cursor:pointer;background:var(--bg)}
.x{background:none;border:0;color:var(--mu);cursor:pointer;font-size:16px}
#msg{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:616px;margin:0 auto;background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:10px;z-index:9}
[hidden]{display:none!important}
</style></head><body><main>
<h1>Mi control financiero</h1>

<section id="auth" hidden>
 <div class="card"><h2>Inicia sesión</h2>
  <label>Correo</label><input id="em" type="email" autocomplete="email">
  <label>Contraseña (mínimo 6 caracteres)</label><input id="pw" type="password" autocomplete="current-password">
  <button class="btn" id="in">Entrar</button>
  <button class="btn alt" id="up">Crear cuenta</button></div>
</section>

<div id="app" hidden>
 <div class="tabs"><button data-t="r" class="on">Resumen</button><button data-t="p">Panel</button><button data-t="g">Gastos</button><button data-t="x">Fijos</button><button data-t="m">Metas</button></div>
 <section id="r"></section>
 <section id="g" hidden>
  <div class="card"><h2>Registrar gasto</h2>
   <div class="g2"><div><label>Monto (COP)</label><input id="ga" type="number" inputmode="numeric" placeholder="20000"></div>
   <div><label>Categoría</label><select id="gc"><option>Comida</option><option>Ocio</option><option>Bicicleta</option><option>Otros</option></select></div></div>
   <label>Pagado con</label><select id="gm"><option value="d">Efectivo / débito</option><option value="t">Tarjeta de crédito</option></select>
   <button class="btn" id="add">Agregar</button>
   <p class="mu">Débito o efectivo se descuenta de tu saldo. Tarjeta se suma a tu deuda.</p></div>
  <div class="card"><h2>Gastos de este mes</h2><div id="list"></div></div>
 </section>
 <section id="p" hidden></section>
 <section id="x" hidden></section>
 <section id="m" hidden></section>
</div>
<div id="msg" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb=supabase.createClient('https://nvyyhukqgitiqmwituhk.supabase.co','sb_publishable_d_vasnMZlYLUcUzLtuU2Jw_TPek-CE8');
const $=id=>document.getElementById(id), f=n=>'$'+Math.round(n).toLocaleString('es-CO');
const CATS=['Comida','Ocio','Bicicleta','Otros'];
const S={uid:null,budgets:{Comida:50,Ocio:25,Bicicleta:5,Otros:20},income:930000,rate:35,balance:0,card:0,fixed:[{n:"Internet",v:135000,d:1,p:null},{n:"Teléfono",v:35000,d:1,p:null}],ex:[],goals:[]};
let mt;const msg=t=>{$('msg').textContent=t;$('msg').hidden=!t;clearTimeout(mt);if(t)mt=setTimeout(()=>msg(''),5000)};
const today=()=>new Date().toLocaleDateString('sv-SE');
const ex=()=>S.ex.filter(e=>e.d.startsWith(today().slice(0,7)));
const mk=()=>today().slice(0,7);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fixed=()=>S.fixed.reduce((a,b)=>a+b.v,0);
const pend=()=>S.fixed.map((x,i)=>({...x,i})).filter(x=>x.p!==mk()).sort((a,b)=>a.d-b.d);
const monthSave=()=>2*S.income*S.rate/100;

async function load(){
 let {data:s,error}=await sb.from('settings').select('*').maybeSingle();
 if(error)return msg(error.message);
 if(!s){const r=await sb.from('settings').insert({user_id:S.uid}).select().single();if(r.error)return msg(r.error.message);s=r.data}
 let gl=Array.isArray(s.goals)?s.goals:[];if(!gl.length&&(+s.goal_target||+s.goal_saved))gl=[{id:Date.now(),n:'Viaje a Japón',t:+s.goal_target,s:+s.goal_saved}];
 gl=gl.map(g=>({img:[],...g}));
 if(gl.some(g=>g.p===undefined)){const n=gl.length;gl=gl.map((g,i)=>({...g,p:Math.floor(100/n)+(i===0?100%n:0)}))}
 Object.assign(S,{budgets:Object.assign({Comida:50,Ocio:25,Bicicleta:5,Otros:20},s.budgets||{}),income:+s.income,rate:+s.rate,balance:+s.balance,card:+s.card,fixed:(s.fixed||[]).map(x=>Array.isArray(x)?{n:x[0],v:+x[1],d:1,p:null}:x),goals:gl});
 const e=await sb.from('expenses').select('*').order('spent_on').order('id');
 if(e.error)return msg(e.error.message);
 S.ex=e.data.map(x=>({i:x.id,d:x.spent_on,a:+x.amount,c:x.category,t:x.on_card}));
 render();
}
async function push(){
 const {error}=await sb.from('settings').upsert({user_id:S.uid,income:S.income,rate:S.rate,balance:S.balance,card:S.card,fixed:S.fixed,goal_target:0,goal_saved:0,goals:S.goals,budgets:S.budgets,updated_at:new Date().toISOString()});
 if(error)msg(error.message);
}
function inp(l,k,o){return `<label>${l}</label><input type="number" inputmode="numeric" value="${(o?S.goal:S)[k]}" data-k="${k}" data-o="${o?1:0}">`}

function renderR(){
 const e=ex(),cash=e.filter(x=>!x.t).reduce((a,b)=>a+b.a,0),cr=e.filter(x=>x.t).reduce((a,b)=>a+b.a,0);
 const budget=2*S.income-monthSave()-fixed(),spent=cash+cr,left=budget-spent,pct=Math.min(100,Math.max(0,spent/budget*100));
 const cat={};e.forEach(x=>cat[x.c]=(cat[x.c]||0)+x.a);
 const P=pend(),pv=P.reduce((a,b)=>a+b.v,0),dd=+today().slice(8);
 const fx=P.length?P.map(x=>`<div class="row"><span>${esc(x.n)} <span class="${x.d<dd?'wa':'mu'}">· día ${x.d}${x.d<dd?' (vencido)':''}</span></span><span><b>${f(x.v)}</b> <button class="pay" data-pay="${x.i}">Pagado</button></span></div>`).join(''):'<div class="row mu"><span>✓ Fijos de este mes pagados</span></div>';
 const bm=Math.max(0,budget),tot=CATS.reduce((a,c)=>a+(S.budgets[c]||0),0);
 const bud=`<div class="card"><h2>Presupuesto por categoría</h2><div class="mu">Base del mes (después de ahorro y fijos): <b>${f(bm)}</b></div>`+CATS.map(c=>{
  const pc=S.budgets[c]||0,asg=bm*pc/100,sp=cat[c]||0,rem=asg-sp,w=asg>0?Math.min(100,sp/asg*100):(sp>0?100:0);
  return `<div style="padding:8px 0;border-top:1px solid var(--bd);margin-top:8px"><div class="row"><b>${c}</b><span><input type="number" inputmode="numeric" min="0" max="100" value="${pc}" data-bd="${c}" style="width:68px;display:inline-block;padding:4px 6px"> %</span></div>
  <div class="bar"><i style="width:${w}%;${rem<0?'background:var(--wa)':''}"></i></div>
  <div class="row mu"><span>Asignado ${f(asg)} · gastado ${f(sp)}</span><b class="${rem<0?'wa':''}">${rem<0?'Te pasaste '+f(-rem):'Quedan '+f(rem)}</b></div></div>`}).join('')+
  `<div class="row ${tot>100?'wa':'mu'}"><span>${tot>100?'Te pasaste del 100%':'Sin asignar'}</span><b>${tot>100?tot+'%':(100-tot)+'%'}</b></div></div>`;
 $('r').innerHTML=`
 <div class="card"><div class="mu">Te queda para gastar este mes</div><div class="big ${left<0?'wa':''}">${f(left)}</div>
  <div class="bar"><i style="width:${pct}%"></i></div><div class="mu">Gastado ${f(spent)} de ${f(budget)} (después de ahorro y fijos)</div></div>
 <div class="card"><h2>Por pagar</h2>
  <div class="row"><span>Tarjetas de crédito</span><span><b>${f(S.card)}</b> <button class="pay" id="paycard">Pagué</button></span></div>
  ${fx}
  <div class="row"><span>Saldo en cuenta</span><b>${f(S.balance)}</b></div>
  <div class="row mu"><span>Libre tras pagar todo</span><b>${f(S.balance-S.card-pv)}</b></div></div>
 <div class="card"><h2>Cada quincena</h2>
  <div class="row"><span>Ahorro (${S.rate}%)</span><b>${f(S.income*S.rate/100)}</b></div>
  <div class="row"><span>Para vivir</span><b>${f(S.income*(1-S.rate/100))}</b></div></div>
 ${bud}
 <div class="card"><h2>Mis datos</h2>${inp('Ingreso neto por quincena','income')}${inp('% de ahorro por quincena','rate')}${inp('Saldo en cuenta','balance')}${inp('Deuda actual de tarjetas','card')}
  <button class="btn alt" id="out">Cerrar sesión</button></div>`;
 $('out').onclick=()=>sb.auth.signOut();
}
function renderG(){
 const e=ex().slice().reverse();
 $('list').innerHTML=e.length?e.map(x=>`<div class="row"><span>${x.d.slice(5)} · ${x.c}${x.t?' 💳':''}</span><span><b>${f(x.a)}</b> <button class="x" data-del="${x.i}">✕</button></span></div>`).join(''):'<span class="mu">Sin gastos registrados.</span>';
}
function renderM(){
 const G=S.goals,ms=monthSave(),tot=G.reduce((a,g)=>a+g.s,0),ap=G.reduce((a,g)=>a+(g.p||0),0);
 const eta=g=>{const rem=Math.max(0,g.t-g.s),am=ms*(g.p||0)/100;
  if(g.t>0&&rem===0)return '🎉 ¡Meta cumplida!'+(g.p?' Puedes reasignar su % a otra meta.':'');
  if(am<=0)return 'Asígnale un % de tu ahorro para calcular la fecha.';
  const mo=Math.ceil(rem/am),d=new Date();d.setMonth(d.getMonth()+mo);
  return `Aporte estimado ${f(am)}/mes · llegas en <b>${mo} meses</b> (${d.toLocaleDateString('es-CO',{month:'long',year:'numeric'})})`};
 const car=g=>`<div class="car" id="car-${g.id}">${(g.img||[]).map((im,i)=>`<div class="sl"><img src="${im}"><button data-delimg="${g.id}:${i}">✕</button></div>`).join('')}<label class="add">＋ Agregar foto<input type="file" accept="image/*" multiple style="display:none" data-imgfor="${g.id}"></label></div>`;
 $('m').innerHTML=`<div class="card"><h2>🎯 Mis metas</h2><div class="big">${f(tot)}</div><div class="mu">ahorrado en ${G.length} meta${G.length===1?'':'s'}</div>
  <div class="row" style="margin-top:8px"><span>Tu ahorro mensual (${S.rate}% de tu ingreso)</span><b>${f(ms)}</b></div>
  <div class="row mu"><span>${ap<100?'Sin asignar a ninguna meta':'Todo tu ahorro está asignado'}</span><b>${100-ap}%</b></div>
  ${G.length>1?'<button class="btn alt" id="eq">Repartir en partes iguales</button>':''}</div>`
 +G.map(g=>{const p=g.t>0?Math.min(100,g.s/g.t*100):0;return `<div class="card"><div class="row"><h2 style="margin:0">${esc(g.n)}</h2><button class="x" data-delg="${g.id}">✕</button></div>
  ${car(g)}
  <div class="big">${f(g.s)} <span class="mu" style="font-size:15px">de ${f(g.t)}</span></div><div class="bar"><i style="width:${p}%"></i></div>
  <div class="mu">${g.t>0&&g.s>=g.t?'':'Faltan '+f(Math.max(0,g.t-g.s))+' ('+Math.round(p)+'%)<br>'}${eta(g)}</div>
  <div class="g2"><div><label>Meta total</label><input type="number" inputmode="numeric" value="${g.t}" data-gt="${g.id}"></div>
  <div><label>% de mi ahorro</label><input type="number" inputmode="numeric" min="0" max="100" value="${g.p||0}" data-gp="${g.id}"></div></div>
  <div class="g2"><div><label>Monto</label><input type="number" inputmode="numeric" id="ga-${g.id}"></div>
  <div><label>Movimiento</label><select id="gs-${g.id}"><option value="in-bal">Aportar desde mi saldo</option><option value="in-ext">Aportar: regalo o ingreso extra</option><option value="out-bal">Retirar y devolver al saldo</option><option value="out-ext">Retirar: ya lo gasté</option></select></div></div>
  <button class="btn" data-gadd="${g.id}">Registrar</button></div>`}).join('')
 +`<div class="card"><h2>Nueva meta</h2><label>Nombre</label><input id="gn" placeholder="Ej: Viaje a Japón"><label>Monto objetivo</label><input id="gv" type="number" inputmode="numeric"><button class="btn" id="addg">Crear meta</button>
  <p class="mu">La fecha de cada meta es un estimado: usa el % de tu ahorro mensual que le asignes y el dinero que ya tiene ahorrado. Al crear una meta recibe el % que aún no está asignado.</p>
  <p class="mu">Desde mi saldo: baja tu saldo en cuenta. Regalo o ingreso extra: suma a la meta sin tocar tu saldo. Al retirar puedes devolver el dinero al saldo o dejarlo como gastado.</p>
  <p class="mu">Las fotos se guardan comprimidas junto con tus datos. Usa pocas por meta para que la app sincronice rápido.</p></div>`;
}
function shrink(file){return new Promise((res,rej)=>{
 const r=new FileReader();
 r.onload=()=>{const im=new Image();im.onload=()=>{
   const mw=1000,sc=Math.min(1,mw/im.width),w=Math.round(im.width*sc),h=Math.round(im.height*sc);
   const c=document.createElement('canvas');c.width=w;c.height=h;
   c.getContext('2d').drawImage(im,0,0,w,h);
   res(c.toDataURL('image/jpeg',0.72));};im.onerror=rej;im.src=r.result;};
 r.onerror=rej;r.readAsDataURL(file);});}
const COL=['#1f7a5a','#d97706','#2563eb','#9333ea'];
function renderP(){
 const m=mk(),[Y,M]=m.split('-').map(Number),dim=new Date(Y,M,0).getDate(),dn=+today().slice(8);
 const pk=M===1?(Y-1)+'-12':Y+'-'+String(M-1).padStart(2,'0');
 const cur=S.ex.filter(x=>x.d.startsWith(m)),prev=S.ex.filter(x=>x.d.startsWith(pk)&&+x.d.slice(8)<=dn);
 const sum=a=>a.reduce((t,x)=>t+x.a,0),spent=sum(cur),pspent=sum(prev);
 const budget=2*S.income-monthSave()-fixed(),left=budget-spent;
 const by=(a,c)=>sum(a.filter(x=>x.c===c));
 const short=v=>v>=1e6?(v/1e6).toFixed(1)+'M':Math.round(v/1000)+'k';
 let acc=0;
 const seg=spent>0?CATS.map((c,i)=>{const p=by(cur,c)/spent*100,o=`<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${COL[i]}" stroke-width="6" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${25-acc}"/>`;acc+=p;return o}).join(''):'';
 const donut=`<svg viewBox="0 0 42 42" style="width:130px;height:130px;flex:none"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--bd)" stroke-width="6"/>${seg}<text x="21" y="23" text-anchor="middle" style="font-size:6px;font-weight:600;fill:var(--tx)">${spent>0?short(spent):'—'}</text></svg>`;
 const leg=CATS.map((c,i)=>{const v=by(cur,c);return `<div class="row" style="padding:3px 0"><span><i class="dot" style="background:${COL[i]}"></i>${c}</span><span><b>${f(v)}</b> <span class="mu">${spent>0?Math.round(v/spent*100):0}%</span></span></div>`}).join('');
 const day=Array(dim).fill(0);cur.forEach(x=>{day[+x.d.slice(8)-1]+=x.a});
 const mx=Math.max(1,...day),bw=300/dim,pk2=Math.max(...day),pkd=day.indexOf(pk2)+1;
 const bars=day.map((v,i)=>{const h=v/mx*70;return `<rect x="${i*bw+bw*.15}" y="${80-h}" width="${bw*.7}" height="${v>0?Math.max(h,1.5):0}" rx="1.5" style="fill:var(--ac);opacity:${i+1===dn?1:.55}"/>`}).join('');
 const lbl=[1,5,10,15,20,25,dim].filter((d,i,a)=>a.indexOf(d)===i).map(d=>`<text x="${(d-1)*bw+bw/2}" y="94" text-anchor="middle" class="lb">${d}</text>`).join('');
 const dl=(a,b)=>b>0?`<b class="${a>b?'wa':''}" style="${a>b?'':'color:var(--ac)'}">${a>=b?'▲':'▼'} ${Math.round(Math.abs(a-b)/b*100)}%</b>`:`<span class="mu">${a>0?'nuevo':'—'}</span>`;
 const cmp=CATS.map(c=>{const a=by(cur,c),b=by(prev,c);return `<div class="row"><span>${c}</span><span>${f(a)} <span class="mu">vs ${f(b)}</span> ${dl(a,b)}</span></div>`}).join('');
 const proj=dn>0?spent/dn*dim:0,sc=Math.max(budget,proj,spent,1),over=proj-budget;
 const pj=spent<=0?'Aún no hay gastos este mes para proyectar.':(over>0?`Al ritmo actual (${f(spent/dn)} al día) terminarías gastando <b>${f(proj)}</b> y te pasarías por <b class="wa">${f(over)}</b>.`:`Al ritmo actual (${f(spent/dn)} al día) terminarías gastando <b>${f(proj)}</b> y te sobrarían <b style="color:var(--ac)">${f(-over)}</b>.`)+(dn<5?' <span class="mu">(estimación temprana: mejora con los días)</span>':'');
 const G=S.goals,ms=monthSave();
 const ge=g=>{const rem=Math.max(0,g.t-g.s),am=ms*(g.p||0)/100;if(g.t>0&&rem===0)return '🎉 Cumplida';if(am<=0)return 'Sin % asignado';const mo=Math.ceil(rem/am),d=new Date();d.setMonth(d.getMonth()+mo);return d.toLocaleDateString('es-CO',{month:'short',year:'numeric'})};
 const gl=G.length?G.map(g=>{const p=g.t>0?Math.min(100,g.s/g.t*100):0;return `<div style="padding:6px 0"><div class="row" style="padding:0"><b>${esc(g.n)}</b><span class="mu">${ge(g)}</span></div><div class="bar"><i style="width:${p}%"></i></div><div class="row mu" style="padding:0"><span>${f(g.s)} de ${f(g.t)}</span><span>${Math.round(p)}%</span></div></div>`}).join(''):'<span class="mu">Aún no tienes metas.</span>';
 const P=pend(),pv=P.reduce((a,b)=>a+b.v,0);
 const pl=P.length?P.map(x=>`<div class="row"><span>${esc(x.n)} <span class="${x.d<dn?'wa':'mu'}">· día ${x.d}${x.d<dn?' (vencido)':''}</span></span><b>${f(x.v)}</b></div>`).join(''):'<div class="row mu"><span>✓ Fijos de este mes pagados</span></div>';
 $('p').innerHTML=`<div class="kp"><div><span class="mu">Gastado</span><b>${f(spent)}</b></div><div><span class="mu">Te queda</span><b class="${left<0?'wa':''}">${f(left)}</b></div><div><span class="mu">Saldo</span><b>${f(S.balance)}</b></div></div>
 <div class="card"><h2>Gasto por categoría (este mes)</h2><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><div style="margin:0 auto">${donut}</div><div style="flex:1;min-width:190px">${leg}</div></div></div>
 <div class="card"><h2>Gasto día a día</h2><div style="overflow-x:auto"><svg viewBox="0 0 300 100" style="width:100%;min-width:280px;height:auto"><line x1="0" y1="80" x2="300" y2="80" style="stroke:var(--bd)"/>${bars}${lbl}</svg></div>
  <div class="mu">${spent>0?`Promedio: ${f(spent/dn)} al día · Mayor gasto: día ${pkd} (${f(pk2)})`:'Sin gastos registrados este mes.'}</div></div>
 <div class="card"><h2>Proyección a fin de mes</h2><div style="position:relative;height:12px;background:var(--bd);border-radius:12px;margin:8px 0"><div style="position:absolute;left:0;top:0;height:100%;width:${Math.min(100,proj/sc*100)}%;background:var(--ac);opacity:.35;border-radius:12px"></div><div style="position:absolute;left:0;top:0;height:100%;width:${Math.min(100,spent/sc*100)}%;background:var(--ac);border-radius:12px"></div><div style="position:absolute;top:-3px;bottom:-3px;left:${Math.min(100,budget/sc*100)}%;width:2px;background:var(--tx)"></div></div>
  <div class="mu" style="font-size:13px">Verde oscuro: gastado · claro: proyección · línea: tu presupuesto (${f(Math.max(0,budget))})</div><p style="margin:8px 0 0">${pj}</p></div>
 <div class="card"><h2>Comparado con el mes anterior</h2><div class="mu" style="font-size:13px;margin-bottom:4px">Hasta el mismo día del mes (día ${dn})</div>
  <div class="row"><b>Total</b><span>${f(spent)} <span class="mu">vs ${f(pspent)}</span> ${dl(spent,pspent)}</span></div>${cmp}</div>
 <div class="card"><h2>Metas</h2>${gl}</div>
 <div class="card"><h2>Próximos pagos</h2>${pl}
  <div class="row"><span>Tarjetas de crédito</span><b>${f(S.card)}</b></div>
  <div class="row mu"><span>Libre tras pagar todo</span><b>${f(S.balance-S.card-pv)}</b></div></div>`;
}
function renderX(){
 const m=mk();
 $('x').innerHTML=`<div class="card"><h2>Gastos fijos de este mes</h2>${S.fixed.length?S.fixed.map((x,i)=>{const ok=x.p===m;return `<div style="padding:8px 0;border-top:1px solid var(--bd)"><div class="row"><b>${esc(x.n)}</b><span class="${ok?'':'wa'}">${ok?'✓ Pagado':'Pendiente'}</span></div><div class="g2"><div><label>Monto</label><input type="number" inputmode="numeric" value="${x.v}" data-fi="${i}" data-fk="v"></div><div><label>Día de pago (1-31)</label><input type="number" inputmode="numeric" min="1" max="31" value="${x.d}" data-fi="${i}" data-fk="d"></div></div><div class="g2"><button class="btn" data-${ok?'undo':'pay'}="${i}">${ok?'Deshacer':'Marcar pagado'}</button><button class="btn alt" data-delx="${i}">Eliminar</button></div></div>`}).join(''):'<span class="mu">No tienes gastos fijos.</span>'}</div>
 <div class="card"><h2>Agregar gasto fijo</h2><label>Nombre</label><input id="fn"><div class="g2"><div><label>Monto</label><input id="fv" type="number" inputmode="numeric"></div><div><label>Día de pago</label><input id="fd" type="number" inputmode="numeric" min="1" max="31"></div></div><button class="btn" id="addf">Agregar</button><p class="mu">Al cambiar de mes, los fijos pagados vuelven a aparecer como pendientes. Al marcar un fijo como pagado se descuenta de tu saldo en cuenta, y al deshacerlo se devuelve.</p></div>`;
}
function render(){renderR();renderP();renderG();renderX();renderM()}

document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.imgfor){const gid=t.dataset.imgfor,files=[...t.files];if(!files.length)return;
  msg('Procesando foto...');Promise.all(files.map(shrink)).then(imgs=>{
   const g=S.goals.find(x=>x.id==gid);if(g){g.img=(g.img||[]).concat(imgs);render();push();msg('')}
  }).catch(()=>msg('No se pudo procesar la imagen'));return}
 if(t.dataset.gp){const g=S.goals.find(x=>x.id==t.dataset.gp);if(g){const oth=S.goals.reduce((a,x)=>a+(x===g?0:x.p||0),0),v=Math.max(0,+t.value||0);g.p=Math.min(v,100-oth);if(v>g.p)msg('Solo queda '+g.p+'% sin asignar');render();push()}return}
 if(t.dataset.gt){const g=S.goals.find(x=>x.id==t.dataset.gt);if(g){g.t=Math.max(0,+t.value||0);render();push()}return}
 if(t.dataset.bd){S.budgets[t.dataset.bd]=Math.min(100,Math.max(0,+t.value||0));render();push();return}
 if(t.dataset.fi){const x=S.fixed[+t.dataset.fi];x[t.dataset.fk]=Math.max(0,+t.value||0);if(x.d<1)x.d=1;if(x.d>31)x.d=31;render();push();return}
 if(t.dataset.k){(t.dataset.o==='1'?S.goal:S)[t.dataset.k]=+t.value||0;render();push()}});
document.addEventListener('click',async e=>{const t=e.target;
 if(t.dataset.t){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b===t));['r','p','g','x','m'].forEach(s=>$(s).hidden=s!==t.dataset.t)}
 if(t.dataset.del){const {error}=await sb.from('expenses').delete().eq('id',t.dataset.del);if(error)return msg(error.message);const g=S.ex.find(x=>x.i==t.dataset.del);S.ex=S.ex.filter(x=>x.i!=t.dataset.del);if(g){if(g.t)S.card-=g.a;else S.balance+=g.a;push()}render()}
 const q=t.dataset;
 if(q.pay!==undefined){const x=S.fixed[+q.pay];x.p=mk();S.balance-=x.v;render();push()}
 if(q.undo!==undefined){const x=S.fixed[+q.undo];x.p=null;S.balance+=x.v;render();push()}
 if(q.delx!==undefined&&confirm('¿Eliminar este gasto fijo?')){S.fixed.splice(+q.delx,1);render();push()}
 if(t.id==='paycard'){const r=prompt('¿Cuánto pagaste de la tarjeta?',Math.round(S.card));if(r===null)return;const a=+String(r).replace(/\D/g,'');if(!(a>0))return msg('Monto inválido');if(a>S.card)return msg('El pago es mayor que tu deuda actual');S.card-=a;S.balance-=a;render();push()}
 if(q.gadd!==undefined){const g=S.goals.find(x=>x.id==q.gadd),a=+String($('ga-'+q.gadd).value).replace(/\D/g,''),m=$('gs-'+q.gadd).value;
  if(!g)return;if(!(a>0))return msg('Escribe un monto');
  if(m.startsWith('in')){if(m==='in-bal'){if(a>S.balance)return msg('Tu saldo en cuenta no alcanza');S.balance-=a}g.s+=a}
  else{if(a>g.s)return msg('La meta no tiene tanto ahorrado');g.s-=a;if(m==='out-bal')S.balance+=a}
  render();push()}
 if(q.delimg!==undefined){const[gid,idx]=q.delimg.split(':');const g=S.goals.find(x=>x.id==gid);if(g){g.img.splice(+idx,1);render();push()}}
 if(q.delg!==undefined&&confirm('¿Eliminar esta meta? Su dinero ahorrado NO se devuelve al saldo; si quieres devolverlo, retíralo antes.')){S.goals=S.goals.filter(x=>x.id!=q.delg);render();push()}
 if(t.id==='eq'){const n=S.goals.length;S.goals.forEach((g,i)=>g.p=Math.floor(100/n)+(i===0?100%n:0));render();push()}
 if(t.id==='addg'){const n=$('gn').value.trim(),v=+$('gv').value;if(!n||!(v>0))return msg('Escribe nombre y monto objetivo');S.goals.push({id:Date.now(),n,t:v,s:0,img:[],p:Math.max(0,100-S.goals.reduce((a,x)=>a+(x.p||0),0))});render();push()}
 if(t.id==='addf'){const n=$('fn').value.trim(),v=+$('fv').value,d=Math.min(31,Math.max(1,+$('fd').value||1));if(!n||!(v>0))return msg('Escribe nombre y monto');S.fixed.push({n,v,d,p:null});render();push()}
});
$('add').onclick=async()=>{const a=+$('ga').value;if(!(a>0))return;
 const {data,error}=await sb.from('expenses').insert({amount:a,category:$('gc').value,on_card:$('gm').value==='t',spent_on:today()}).select().single();
 if(error)return msg(error.message);
 S.ex.push({i:data.id,d:data.spent_on,a:+data.amount,c:data.category,t:data.on_card});if(data.on_card)S.card+=+data.amount;else S.balance-=+data.amount;$('ga').value='';render();push()};

const creds=()=>({email:$('em').value.trim(),password:$('pw').value});
const chk=c=>!c.email||!c.password?'Escribe tu correo y contraseña':c.password.length<6?'La contraseña debe tener mínimo 6 caracteres':'';
$('in').onclick=async()=>{const c=creds(),v=chk(c);if(v)return msg(v);const {error}=await sb.auth.signInWithPassword(c);if(error)msg(error.message)};
$('up').onclick=async()=>{const c=creds(),v=chk(c);if(v)return msg(v);const {error}=await sb.auth.signUp({...c,options:{emailRedirectTo:location.origin+location.pathname}});
 msg(error?error.message:'Cuenta creada. Confirma tu correo y luego inicia sesión.')};

sb.auth.onAuthStateChange((ev,ses)=>setTimeout(async()=>{
 $('auth').hidden=!!ses;$('app').hidden=!ses;
 if(!ses){S.uid=null;return}
 if(S.uid!==ses.user.id){S.uid=ses.user.id;await load()}
},0));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.uid)load()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></main></body></html>
